      - data:
          code: >
            def main(texts: list, query: str) -> dict:
                # 每份文件独立限长，保留编号和空文本提示，避免误称已完整阅读所有附件。
                chunks = []
                hints = []
                has_text = False
                for index, text in enumerate((texts or [])[:3], 1):
                    content = text.strip() if isinstance(text, str) else ""
                    length = len(content)
                    if not content:
                        chunks.append("附件%d：未提取到可读文本，不得推断其内容。" % index)
                        continue
                    has_text = True
                    note = "仅保留前18000字符，内容已截断" if length > 18000 else "已保留本次提取的全部文本，不保证提取完整覆盖原文件"
                    chunks.append("附件%d（提取%d字符；%s）：\n%s" % (index, length, note, content[:18000]))
                    hints.append(content[:250])
                if len(texts or []) > 3:
                    chunks.append("超过3份的附件未处理，请分批上传。")
                # 比对检索同时带上问题与少量文件主题，避免仅用“分析一下”检索不到相应制度。
                search = ((query or "").strip()[:1000] + "\n" + "\n".join(hints)).strip()[:2000]
                return {"file_context": "\n\n".join(chunks), "has_text": "1" if has_text else "0", "query": search}
