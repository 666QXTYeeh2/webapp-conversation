                mode = "快速问答"
                prefix = "[[CHAT_REQUEST_V1]]\n"
                if query.startswith(prefix):
                    try:
                        payload = json.loads(query[len(prefix):])
                        if isinstance(payload, dict) and isinstance(payload.get("query"), str):
                            query = payload["query"]
                            mode = "智能推理" if payload.get("answer_mode") == "智能推理" else "快速问答"
                    except (ValueError, TypeError):
                        pass
                return {"query": query, "answer_mode": mode}
