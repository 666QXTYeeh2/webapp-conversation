      - data:
          code: >
            import re

            import unicodedata



            def main(query: str) -> dict:
                text = unicodedata.normalize("NFKC", query or "").strip().lower()
                # 去除常见分隔符识别拆写脏话，不使用“操”“妈”等单字，减少正常业务词误判。
                compact = re.sub(r"[\W_]+", "", text)
                chinese_terms = ("傻逼", "傻比", "傻b", "煞笔", "沙比", "操你", "草你", "艹你", "他妈的", "你妈的", "去你妈", "狗日的", "王八蛋", "混蛋", "你是废物", "你个废物", "滚蛋", "垃圾玩意")
                english_abuse = re.search(r"(?<![a-z])(?:fuck(?:ing|ed|er|ers)?|shit|bullshit|bitch(?:es)?|asshole|bastard|cnm|nmsl|tmd)(?![a-z])", text)
                if any(term in compact for term in chinese_terms) or english_abuse:
                    return {"route": "unclear"}
                # 只匹配完整寒暄组合，带具体问题时继续回答。
                rest = compact
                for phrase in ("谢谢您的帮助", "非常感谢", "谢谢您", "谢谢你", "谢谢", "多谢", "感谢", "明白了", "了解了", "知道了", "好的", "收到", "再见", "拜拜", "ok"):
                    rest = rest.replace(phrase, "")
                if compact and not rest:
                    return {"route": "thanks"}
                # 仅对完整匹配的无明确意图输入兜底，包含具体内容的问题仍交给后续流程。
                if not compact or compact in {"啊", "嗯", "呃", "哦", "啥", "什么", "随便", "随便问问", "不知道", "哈哈", "呵呵", "123", "测试", "asdf", "qwer"}:
                    return {"route": "unclear"}
                if compact in {"你好", "您好", "嗨", "在吗", "早上好", "下午好", "晚上好", "hello", "hi", "谢谢", "感谢"}:
                    return {"route": "greeting"}
                return {"route": "normal"}
