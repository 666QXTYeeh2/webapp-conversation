app:
  description: 维护通用知识问答页面的欢迎语、参考问题、回答模式和上传配置，无模型依赖。
  icon: ⚙️
  icon_background: '#E0F2FE'
  icon_type: emoji
  mode: workflow
  name: 通用知识助手配置中心 V2.0
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions:
      - .JPG
      - .JPEG
      - .PNG
      - .GIF
      - .WEBP
      - .SVG
      allowed_file_types:
      - image
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: false
      fileUploadConfig:
        attachment_image_file_size_limit: 2
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        file_upload_limit: 20
        image_file_batch_limit: 10
        image_file_size_limit: 10
        single_chunk_attachment_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInLoop: false
        sourceType: start
        targetType: code
      id: config-edge-0
      source: '1763000000001'
      sourceHandle: source
      target: '1763000000002'
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInLoop: false
        sourceType: code
        targetType: end
      id: config-edge-1
      source: '1763000000002'
      sourceHandle: source
      target: '1763000000003'
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        desc: ''
        selected: false
        title: 开始：传入缓存版本
        type: start
        variables:
        - label: 客户端缓存版本（首次留空）
          max_length: 64
          options: []
          required: false
          type: text-input
          variable: ver
      height: 109
      id: '1763000000001'
      position:
        x: 80
        y: 280
      positionAbsolute:
        x: 80
        y: 280
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        code: "import json\nimport hashlib\n\n# 公开配置，不保存密钥和用户私密数据。\nCONFIG = {'config_version':\
          \ '44246794cc950d1b', 'unchanged': False, 'schema_version': '1.0', 'app':\
          \ {'name': '知识问答', 'subtitle': '让每一个答案都有依据', 'locale': 'zh-CN', 'demo':\
          \ True}, 'home': {'welcome': '从已绑定的资料中寻找答案，也可以上传文件进行分析。', 'description':\
          \ '查询知识、梳理流程、提炼重点，让复杂的信息更清晰。', 'input_placeholder': '输入你的问题，例如：这个项目的验收需要哪些材料？',\
          \ 'quick_questions': ['星河项目验收需要哪些材料？', '2026年10月提交的办公物资采购申请，审批流程是什么？', '境内公务差旅报销有哪些容易遗漏的细节？']},\
          \ 'modules': [], 'answer_modes': [{'value': '快速问答', 'label': '快速问答'}, {'value':\
          \ '智能推理', 'label': '智能推理'}], 'default_answer_mode': '快速问答', 'upload': {'enabled':\
          \ True, 'extensions': ['.pdf', '.docx', '.txt', '.md'], 'max_files': 3,\
          \ 'max_size_mb': 15, 'ocr_enabled': False, 'privacy_tip': '请遮盖姓名、身份证号、电话、住址和就诊条码等不必要的个人信息。'},\
          \ 'switches': {'history_enabled': True, 'answer_mode_enabled': True, 'external_agent_enabled':\
          \ False, 'dynamic_scope_enabled': False, 'register_enabled': False, 'personal_report_query_enabled':\
          \ False}, 'messages': {'greeting': '您好，我是知识问答助手。您可以查询资料、梳理流程，也可以上传文件进行总结或对比。请描述您想了解的内容。',\
          \ 'thanks': '不客气，希望对您有所帮助。后续如有其他问题，欢迎随时咨询。', 'unclear': '不理解您的具体意思，请详细描述您想咨询的问题。',\
          \ 'no_evidence': '这个问题我暂时还不能准确解答。请补充具体主题、项目名称或相关文件，我再帮您梳理。', 'upload_failed':\
          \ '文件上传失败，请检查格式、大小和网络后重试。', 'service_error': '服务暂时不可用，请稍后重试。'}, 'medical':\
          \ {'disclaimer': '', 'emergency_tip': '', 'fictional_notice': ''}}\n\ndef\
          \ main(ver: str = '') -> dict:\n    body = json.dumps(CONFIG, ensure_ascii=False,\
          \ sort_keys=True)\n    version = hashlib.sha256(body.encode()).hexdigest()[:16]\n\
          \    unchanged = (ver or '').strip() == version\n    payload = {\"config_version\"\
          : version, \"unchanged\": unchanged}\n    if not unchanged:\n        payload.update(CONFIG)\n\
          \    return {\"config\": json.dumps(payload, ensure_ascii=False), \"config_version\"\
          : version, \"unchanged\": unchanged}\n"
        code_language: python3
        desc: ''
        outputs:
          config:
            children: null
            type: string
          config_version:
            children: null
            type: string
          unchanged:
            children: null
            type: boolean
        selected: true
        title: 通用助手公开配置
        type: code
        variables:
        - value_selector:
          - '1763000000001'
          - ver
          variable: ver
      height: 52
      id: '1763000000002'
      position:
        x: 440
        y: 280
      positionAbsolute:
        x: 440
        y: 280
      selected: true
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        desc: ''
        outputs:
        - value_selector:
          - '1763000000002'
          - config
          variable: config
        - value_selector:
          - '1763000000002'
          - config_version
          variable: config_version
        - value_selector:
          - '1763000000002'
          - unchanged
          variable: unchanged
        selected: false
        title: 返回配置
        type: end
      height: 140
      id: '1763000000003'
      position:
        x: 800
        y: 280
      positionAbsolute:
        x: 800
        y: 280
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    viewport:
      x: 0
      y: 0
      zoom: 0.9
  rag_pipeline_variables: []
